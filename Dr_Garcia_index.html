<script>
// The contact information is embedded in this HTML; no separate .vcf upload is needed.
const contactVCF = "BEGIN:VCARD\nVERSION:3.0\nN:Garcia;Luis;F.;Dr.;\nFN:Dr. Luis F Garcia\nORG:Dr. Garcia Biomagnetism\nEMAIL;TYPE=INTERNET,WORK:info@drgarciabiomagnetism.com\nTEL;TYPE=WORK,VOICE:+17329838616\nADR;TYPE=WORK:;;461 Park Ave. South\\, 12th Floor;New York;NY;10016;USA\nURL;TYPE=WORK:https://drgarciabiomagnetism.com/\nitem1.URL:https://www.facebook.com/DrGarciaBiomagnetism\nitem1.X-ABLabel:Facebook\nitem2.URL:https://www.instagram.com/drgarciabiomagnetism/\nitem2.X-ABLabel:Instagram\nitem3.URL:https://twitter.com/thebiomagnetism\nitem3.X-ABLabel:Twitter\nitem4.URL:https://www.youtube.com/@luisfergarciasaa\nitem4.X-ABLabel:YouTube\nitem5.URL:https://www.linkedin.com/company/dr-garcia-biomagnetism\nitem5.X-ABLabel:LinkedIn\nitem6.URL:https://www.tiktok.com/@drgarciabiomagnetism\nitem6.X-ABLabel:TikTok\nitem7.URL:https://www.pinterest.com/DrGarciaBiomagnetism/\nitem7.X-ABLabel:Pinterest\nEND:VCARD\n";

document.getElementById('saveContactBtn').addEventListener('click', function (event) {
  event.preventDefault();
  // CRLF line endings are required by the vCard format.
  const content = contactVCF.replace(/\r?\n/g, '\r\n');
  const blob = new Blob([content], {type: 'text/vcard;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'Dr_Luis_F_Garcia.vcf';
  document.body.appendChild(link);
  link.click();
  link.remove();
  // Allow the browser time to initiate the download before releasing the blob URL.
  setTimeout(() => URL.revokeObjectURL(url), 60000);
});
</script>
